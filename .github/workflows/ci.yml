# The one gate the repo already documents (zrcin-gate) is the CI: go build/vet/
# gofmt/test, the web toolchain (typecheck + node tests + build) and the
# embedded-artifact freshness comparison, in the same order a release run uses.
# The engine repo is checked out beside this tree (the default build imports
# its aop/payloads contract package); the hub/scan binaries themselves are
# still not built here (-skip-harness).
name: ci

on:
  push:
  pull_request:

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The payload contract package (aop/payloads) lives in the engine repo,
      # and internal/aop imports it in every build — the default build needs
      # the engine's aop module checkout the way inprochost builds need the
      # whole tree. Public repo, same layout the go.mod replace expects.
      - uses: actions/checkout@v4
        with:
          repository: c1ayooo/cyber-harness
          ref: tianwu/fixes
          path: ../cyber-harness

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      # pnpm 11 per pnpm-workspace.yaml; --frozen-lockfile keeps CI honest about
      # the dependency set the repo actually pins.
      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: 安装前端依赖
        run: pnpm install --frozen-lockfile

      - name: zrcin-gate（跳过外部 harness 构建）
        # The c1ayooo/* forks are not in the public checksum database; the
        # local build scripts set the same bypass (scripts/build-harness.sh).
        env:
          GONOSUMDB: github.com/c1ayooo/*
        run: go run ./cmd/zrcin-gate -skip-harness
