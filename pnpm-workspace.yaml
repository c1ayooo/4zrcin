packages:
  - 'web'
  # The component library lives in this repository: two source-only packages,
  # resolved by web's tsconfig paths and vite aliases (no package build, no
  # publish). Listed here so pnpm installs their dependencies.
  - 'web/packages/ui'
  - 'web/packages/theme'

# pnpm 11: the build-script allowlist lives here (the package.json "pnpm" field
# is no longer read). @swc/core fetches its native binary on install.
allowBuilds:
  esbuild: true
  '@swc/core': true
